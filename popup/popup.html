<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>OSINT Graph Mapper</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 4px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .keys-section {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .keys-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .api-link {
      color: var(--accent-color);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .api-link:hover {
      color: var(--accent-hover);
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      color: #34d399;
      display: none;
    }
  </style>
</head>
<body>
  <h2>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    OSINT Graph
  </h2>

  <form id="searchForm">
    <div class="form-group">
      <label for="searchType">Type de recherche</label>
      <select id="searchType">
        <option value="person">Nom / Prénom</option>
        <option value="email">Adresse Email</option>
      </select>
    </div>

    <div id="personFields">
      <div class="row">
        <div class="form-group">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" placeholder="Ex: Jean">
        </div>
        <div class="form-group">
          <label for="nom">Nom</label>
          <input type="text" id="nom" placeholder="Ex: Dupont">
        </div>
      </div>
    </div>

    <div id="emailFields" style="display: none;">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Ex: j.dupont@example.com">
      </div>
    </div>

    <button type="submit" id="btnSubmit">Lancer la Cartographie</button>
  </form>

  <div class="keys-section">
    <div class="keys-title">Clés API (optionnelles)</div>
    <div class="form-group">
      <label for="pappersKey"><a class="api-link" href="https://moncompte.pappers.fr/inscription" target="_blank" rel="noreferrer">Pappers API</a> Key</label>
      <input type="password" id="pappersKey" placeholder="Clé API Pappers">
    </div>
    <div class="form-group">
      <label for="serpapiKey"><a class="api-link" href="https://serpapi.com/manage-api-key" target="_blank" rel="noreferrer">SerpApi</a> Key</label>
      <input type="password" id="serpapiKey" placeholder="Clé API SerpApi">
    </div>
    <button type="button" id="btnSaveKeys" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main);">Enregistrer les Clés</button>
    <button type="button" id="btnOpenOptions" style="margin-top: 8px; background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main);">Paramètres</button>
    <div id="statusMsg" class="status">Clés enregistrées !</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
